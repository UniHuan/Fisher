# API origin behind WAF + SLB. TLS terminates at the cloud entry point; this
# server listens on plain HTTP in the private subnet.
upstream szfisher_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_x_request_id $szfisher_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_x_forwarded_proto $szfisher_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

log_format szfisher_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$szfisher_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,"upstream_time_s":"$upstream_response_time"}';

server {
    listen 8080;
    server_name fish-api.unihuan.com fish-api-staging.unihuan.com;
    server_tokens off;

    access_log /var/log/nginx/access.log szfisher_json;
    client_max_body_size 21m;
    keepalive_timeout 65;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass http://szfisher_api;
        include /etc/nginx/snippets/szfisher-proxy.conf;
    }

    location = /ready {
        proxy_pass http://szfisher_api;
        include /etc/nginx/snippets/szfisher-proxy.conf;
    }

    location /api/v1/ {
        proxy_pass http://szfisher_api;
        include /etc/nginx/snippets/szfisher-proxy.conf;
        # POI sync and large imports can take longer than a normal JSON request.
        proxy_read_timeout 120s;
    }

    # No static content on the API host.
    location / {
        return 404;
    }
}
