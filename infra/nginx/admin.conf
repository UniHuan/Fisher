# Static admin origin. TLS terminates at the WAF/CDN; this server listens on
# plain HTTP inside the private origin network. Keep the API origins in the CSP
# aligned with NEXT_PUBLIC_API_BASE_URL at image build time.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Tencent Maps GL evaluates its style bundle and fetches map styles from
    # mapstyle.qpic.cn. 'unsafe-eval' is required by the SDK; script origins
    # remain restricted to Tencent map hosts and this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://map.qq.com https://*.qq.com https://*.qpic.cn https://*.gtimg.com https://*.gtimg.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://fish-static.unihuan.com https://fish-static-staging.unihuan.com https://fish-api.unihuan.com https://fish-api-staging.unihuan.com https://*.qq.com https://*.qpic.cn https://*.gtimg.com https://*.gtimg.cn; font-src 'self' data: https://*.qq.com https://*.qpic.cn https://*.gtimg.com https://*.gtimg.cn; connect-src 'self' https://fish-api.unihuan.com https://fish-api-staging.unihuan.com https://map.qq.com https://apis.map.qq.com https://*.qq.com https://*.qpic.cn https://*.gtimg.com https://*.gtimg.cn; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The static export has hashed filenames; cache them for a year.
    location /_next/static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html and login state must never be cached at the CDN or browser.
    # `expires epoch` emits Cache-Control: no-cache without shadowing the
    # security headers inherited from the server block.
    location = /index.html {
        expires epoch;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
