services:
  postgres:
    image: postgres:18
    container_name: szfisher-postgres-test
    environment:
      POSTGRES_USER: szfisher
      POSTGRES_PASSWORD: szfisher
      POSTGRES_DB: szfisher_test
    ports:
      - "5432:5432"
    volumes:
      - szfisher_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szfisher -d szfisher_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  szfisher_postgres_test_data:
