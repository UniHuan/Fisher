    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusDto"
      tags: &a1
        - public
  /ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusDto"
        "503":
          description: Dependency unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags: *a1
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters:
        - &a2
          name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - &a3
          name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
