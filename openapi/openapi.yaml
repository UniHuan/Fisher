        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Session issued, TOTP required, or TOTP binding required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AdminSessionDto"
                          - $ref: "#/components/schemas/LoginMfaRequiredDto"
                          - $ref: "#/components/schemas/LoginMustBindTotpDto"
        "400": &a4
          description: Bad request (40001)
          content:
