  /api/v1/reports/mine:
    get:
      operationId: ReportsController_mine
      parameters:
        - *a26
        - *a27
        - name: status
          required: false
          in: query
          description: pending=machine_pending; published=published/human_approved;
            rejected=machine_rejected/human_rejected; removed=admin removal
          schema:
            default: all
            type: string
            enum:
              - all
              - pending
              - published
              - rejected
              - removed
        - name: cursor
          required: false
          in: query
          description: "Opaque cursor: base64(created_at|report_id)"
          schema:
            maxLength: 256
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 20
            default: 10
