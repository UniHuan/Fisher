          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "409": &a8
          description: State conflict (40901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "413": &a9
          description: Payload too large (41301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "422": &a10
          description: Business validation failed (42201)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "429":
          description: Too many login attempts (42901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": &a11
