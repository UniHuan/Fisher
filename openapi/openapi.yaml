                spot_id:
                  type: string
                  example: 01HX0000000000000000000000
                purpose:
                  type: string
                  enum:
                    - cover
                    - detail
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Compressed WebP image and short-lived preview URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/UploadImageResponseDto"
        "400":
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401":
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403":
          description: Forbidden (40301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404":
          description: Spot does not exist (40401)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "413":
          description: Image exceeds 10 MB (41301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500":
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "503":
          description: Storage unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security:
        - admin-cookie: []
      summary: Upload and compress a spot image
      tags:
        - admin uploads
  /api/v1/uploads/ugc:
    post:
      description: Accepts JPG, PNG and WebP up to 10 MB, re-encodes to WebP and
        returns the private work-bucket key. At most 30 images per user per day.
      operationId: UploadsUgcController_create
      parameters:
        - name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Compressed WebP work-bucket key and dimensions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/UploadUgcResponseDto"
        "400":
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401":
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403":
          description: Forbidden (40302)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "413":
          description: Payload too large (41301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "429":
          description: Too many requests (42901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500":
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "503":
          description: Dependency unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security:
        - bearer: []
      summary: Upload and compress a report image
      tags:
        - uploads
  /api/v1/admin/imports/{id}:
    get:
      operationId: ImportsController_job
      parameters:
        - &a90
          name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - &a91
          name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
        - name: id
          required: true
          in: path
          description: Import job ULID
          schema:
            example: 01HX0000000000000000000000
            type: string
      responses:
        "200":
          description: Import job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportJobDto"
        "401": &a92
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403": &a93
          description: Forbidden (40301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404":
          description: Import job does not exist (40401)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": &a94
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security: &a95
        - admin-cookie: []
      summary: Get an import job status and counts
      tags: &a96
        - admin imports
  /api/v1/admin/imports/{id}/errors:
    get:
      operationId: ImportsController_errors
      parameters:
        - *a90
        - *a91
        - name: id
          required: true
          in: path
          description: Import job ULID
          schema:
            example: 01HX0000000000000000000000
            type: string
      responses:
        "200":
          description: CSV report
        "401": *a92
        "403": *a93
        "404":
          description: Import or report does not exist (40401)
          content:
            text/csv:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": *a94
      security: *a95
      summary: Download the import error and warning CSV
      tags: *a96
info:
  title: SZFisher API
  description: "Shenzhen fishing assistant API. Base path: /api/v1."
  version: 1.0.0
  contact: {}
tags:
  - name: public
    description: Public client endpoints
  - name: admin auth
    description: Admin authentication and sessions
  - name: admin dictionaries
    description: Super-admin dictionary maintenance
  - name: audit
    description: Audit log queries
  - name: config
    description: Client configuration whitelist
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    admin-cookie:
      type: apiKey
      in: cookie
      name: __Host-fish_access
  schemas:
    HealthStatusDto:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    ApiEnvelopeBaseDto:
      type: object
      properties:
        code:
          type: number
          example: 0
          description: Business code; 0 means success
        message:
          type: string
          example: ok
        request_id:
          type: string
          example: req_01HX0000000000000000000000
      required:
        - code
        - message
        - request_id
    ApiEnvelopeDto:
      type: object
      properties:
        code:
          type: number
          example: 0
          description: Business code; 0 means success
        message:
          type: string
          example: ok
        request_id:
          type: string
          example: req_01HX0000000000000000000000
        data:
          type: object
          additionalProperties: true
          description: Operation payload; its shape is documented per endpoint
      required:
        - code
        - message
        - request_id
        - data
    ApiValidationIssueDto:
      type: object
      properties:
        field:
          type: string
          example: dict_key
        message:
          type: string
          example: dict_key must be longer than or equal to 1 characters
      required:
        - field
        - message
    ApiErrorEnvelopeDto:
      type: object
      properties:
        code:
          type: number
          enum:
            - 40001
            - 40101
            - 40102
            - 40301
            - 40302
            - 40303
            - 40304
            - 40305
            - 40401
            - 40402
            - 40901
            - 40902
            - 41301
            - 42201
            - 42901
            - 50001
            - 50301
          example: 40001
          description: Stable business error code
        message:
          type: string
          example: Bad request
        data:
          type: object
          additionalProperties: true
          nullable: true
          example: null
          description: Always null for failures
        request_id:
          type: string
          example: req_01HX0000000000000000000000
        details:
          description: Field-level validation details when available
          type: array
          items:
            $ref: "#/components/schemas/ApiValidationIssueDto"
      required:
        - code
        - message
        - data
        - request_id
    AdminProfileDto:
      type: object
      properties:
        admin_id:
          type: string
          example: 01HX0000000000000000000000
        username:
          type: string
          example: operator01
        role:
          type: string
          enum:
            - super_admin
            - operator
            - reviewer
          example: operator
        totp_enabled:
          type: boolean
          example: true
      required:
        - admin_id
        - username
        - role
        - totp_enabled
    AdminSessionDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
      required:
        - csrf_token
        - admin
    LoginMfaRequiredDto:
      type: object
      properties:
        mfa_required:
          type: boolean
          enum:
            - true
          example: true
        mfa_token:
          type: string
          example: mfa-token-value
      required:
        - mfa_required
        - mfa_token
    LoginMustBindTotpDto:
      type: object
      properties:
        must_bind_totp:
          type: boolean
          enum:
            - true
          example: true
        mfa_token:
          type: string
          example: mfa-token-value
      required:
        - must_bind_totp
        - mfa_token
    LoginDto:
      type: object
      properties:
        username:
          type: string
          example: operator01
          maxLength: 64
        password:
          type: string
          example: correct horse battery staple
          maxLength: 128
      required:
        - username
        - password
    TotpSetupDto:
      type: object
      properties:
        otpauth_uri:
          type: string
          example: otpauth://totp/SZFisher:operator01?secret=...
        manual_key:
          type: string
          example: JBSWY3DPEHPK3PXP
      required:
        - otpauth_uri
        - manual_key
    MfaTokenDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
      required:
        - mfa_token
    TotpEnableDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        recovery_codes:
          example:
            - AAAA-BBBB
            - CCCC-DDDD
          type: array
          items:
            type: string
      required:
        - csrf_token
        - admin
        - recovery_codes
    TotpCodeDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
        code:
          type: string
          example: "123456"
          pattern: ^\d{6}$
      required:
        - mfa_token
        - code
    TotpRecoveryDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        remaining_recovery_codes:
          type: number
          example: 9
      required:
        - csrf_token
        - admin
        - remaining_recovery_codes
    RecoveryCodeDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
        recovery_code:
          type: string
          example: AAAA-BBBB
          maxLength: 32
      required:
        - mfa_token
        - recovery_code
    MeDto:
      type: object
      properties:
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        permissions:
          example:
            - spot:read
            - audit:read
          type: array
          items:
            type: string
        csrf_token:
          type: string
          example: csrf-token-value
      required:
        - admin
        - permissions
        - csrf_token
    AppUserDto:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
          example: 钓友 A7K2
        avatar_url:
          type: string
          nullable: true
          example: null
      required:
        - nickname
        - avatar_url
    AppSessionDto:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: v1.01HX0000000000000000000000.random.signature
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 7200
        user:
          $ref: "#/components/schemas/AppUserDto"
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
    WechatLoginDto:
      type: object
      properties:
        code:
          type: string
          example: 081Abc000xyz
          maxLength: 512
      required:
        - code
    RefreshTokenDto:
      type: object
      properties:
        refresh_token:
          type: string
          example: v1.01HX0000000000000000000000.random.signature
          maxLength: 512
      required:
        - refresh_token
    AppNoticeDto:
      type: object
      properties:
        report_id:
          type: string
          example: 01HX0000000000000000000000
        moderation_status:
          type: string
          enum:
            - machine_rejected
            - human_rejected
            - removed
        reject_reason:
          type: string
          nullable: true
          example: 广告引流
        audit_time:
          type: string
          format: date-time
      required:
        - report_id
        - moderation_status
        - reject_reason
        - audit_time
    AppMeDto:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AppUserDto"
        can_publish:
          type: boolean
          example: true
        restricted_until:
          type: string
          format: date-time
          nullable: true
          example: null
        notices:
          type: array
          items:
            $ref: "#/components/schemas/AppNoticeDto"
      required:
        - user
        - can_publish
        - restricted_until
        - notices
    CreateReportResponseDto:
      type: object
      properties:
        report_id:
          type: string
          example: 01HX0000000000000000000000
        moderation_status:
          type: string
          enum:
            - machine_pending
            - machine_rejected
            - published
            - human_approved
            - human_rejected
            - removed
          example: published
          description: 201 is returned regardless of the machine review outcome
        message:
          type: string
          example: 已发布
      required:
        - report_id
        - moderation_status
        - message
    CreateReportDto:
      type: object
      properties:
        spot_id:
          type: string
          example: 01HX0000000000000000000000
        content_type:
          type: string
          enum:
            - comment
            - catch
            - intel
          example: comment
        content:
          type: string
          description: Plain text, 1 to 500 Unicode code points after trimming. Emoji
            count as one.
          example: 今天罗非爆护，巴掌大，钓了十几条。
          maxLength: 2000
        image_keys:
          maxItems: 6
          description: Work-bucket keys returned by POST /uploads/ugc; at most 6 after
            deduplication, each owned by the current user
          example:
            - ugc/01HX0000000000000000000000/01HX0000000000000000000001.webp
          type: array
          items:
            type: string
        fish_key:
          type: string
          description: Required for catch content
          maxLength: 64
          example: luofei
        catch_weight_kg:
          type: number
          description: Catch weight in kilograms; catch content only
          minimum: 0.01
          maximum: 999.99
          example: 2.5
        terms_version:
          type: string
          description: Required the first time the user accepts the community terms
          maxLength: 16
          example: 2026-11-20
      required:
        - spot_id
        - content_type
        - content
    ReportLikeResponseDto:
      type: object
      properties:
        liked:
          type: boolean
          example: true
        like_count:
          type: integer
          example: 18
      required:
        - liked
        - like_count
    AbuseReportResponseDto:
      type: object
      properties:
        reported:
          type: boolean
          example: true
          description: Always true; a duplicate report from the same user is success
      required:
        - reported
    AbuseReportDto:
      type: object
      properties:
        reason:
          type: string
          enum:
            - ad
            - abuse
            - false_info
            - privacy
            - other
          example: ad
          description: Abuse category; free text is deliberately not collected
      required:
        - reason
    DeleteReportResponseDto:
      type: object
      properties:
        deleted:
          type: boolean
          example: true
      required:
        - deleted
    MyReportSpotDto:
      type: object
      properties:
        spot_id:
          type: string
          example: 01HX0000000000000000000001
        spot_name:
          type: string
          example: 深圳湾公园东门钓点
        open_status:
          type: string
          nullable: true
          example: open
        can_open:
          type: boolean
          example: true
          description: False when the spot is banned, offline or deleted
      required:
        - spot_id
        - spot_name
        - open_status
        - can_open
    MyReportItemDto:
      type: object
      properties:
        report_id:
          type: string
          example: 01HX0000000000000000000000
        content_type:
          type: string
          enum:
            - comment
            - catch
            - intel
          example: comment
        content:
          type: string
          example: 今天鱼口不错
        images:
          example:
            - /api/v1/uploads/preview?key=...&area=working&expires=...&signature=...
          description: Public paths for visible images; 15-minute signed work-bucket
            previews for pending, rejected and removed images
          type: array
          items:
            type: string
        moderation_status:
          type: string
          enum:
            - machine_pending
            - machine_rejected
            - published
            - human_approved
            - human_rejected
            - removed
          example: machine_pending
        reject_reason:
          type: string
          nullable: true
          example: 广告引流
        created_at:
          type: string
          format: date-time
        audit_time:
          type: string
          format: date-time
          nullable: true
          example: null
        spot:
          $ref: "#/components/schemas/MyReportSpotDto"
      required:
        - report_id
        - content_type
        - content
        - images
        - moderation_status
        - reject_reason
        - created_at
        - audit_time
        - spot
    MyReportPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyReportItemDto"
        next_cursor:
          type: string
          nullable: true
          example: null
        total:
          type: integer
          example: 3
      required:
        - items
        - next_cursor
        - total
    PublicReportAuthorDto:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
          example: 钓友 A7K2
        avatar_url:
          type: string
          nullable: true
          example: null
      required:
        - nickname
        - avatar_url
    PublicReportItemDto:
      type: object
      properties:
        report_id:
          type: string
          example: 01HX0000000000000000000000
        spot_id:
          type: string
          example: 01HX0000000000000000000001
        content_type:
          type: string
          enum:
            - comment
            - catch
            - intel
          example: comment
        content:
          type: string
          example: 今天鱼口不错
        images:
          example:
            - /api/v1/uploads/public/ugc/01HX0000000000000000000000/01HX0000000000000000000001.webp
          description: Relative public image paths served by the cacheable UGC image route
          type: array
          items:
            type: string
        fish_key:
          type: string
          nullable: true
          example: luofei
        catch_weight_kg:
          type: string
          nullable: true
          example: "2.50"
          description: Decimal serialized as a string
        created_at:
          type: string
          format: date-time
        like_count:
          type: integer
          example: 18
        liked_by_me:
          type: boolean
          example: false
        is_mine:
          type: boolean
          example: false
        is_adopted:
          type: boolean
          example: false
        author:
          $ref: "#/components/schemas/PublicReportAuthorDto"
      required:
        - report_id
        - spot_id
        - content_type
        - content
        - images
        - fish_key
        - catch_weight_kg
        - created_at
        - like_count
        - liked_by_me
        - is_mine
        - is_adopted
        - author
    PublicReportPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicReportItemDto"
        next_cursor:
          type: string
          nullable: true
          example: null
        total:
          type: integer
          example: 12
      required:
        - items
        - next_cursor
        - total
    AuditLogItemDto:
      type: object
      properties:
        log_id:
          type: string
          example: 01HX0000000000000000000000
        admin_id:
          type: string
          example: 01HX0000000000000000000001
        action:
          type: string
          example: dictionary.update
        entity_type:
          type: string
          example: dictionary
        entity_id:
          type: string
          nullable: true
          example: poi_type:food
        before_json:
          type: object
          additionalProperties: true
