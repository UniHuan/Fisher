info:
  title: SZFisher API
  description: "Shenzhen fishing assistant API. Base path: /api/v1."
  version: 1.0.0
  contact: {}
tags:
  - name: public
    description: Public client endpoints
  - name: admin auth
    description: Admin authentication and sessions
  - name: admin dictionaries
    description: Super-admin dictionary maintenance
  - name: audit
    description: Audit log queries
  - name: config
    description: Client configuration whitelist
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    admin-cookie:
      type: apiKey
      in: cookie
      name: __Host-fish_access
  schemas:
    HealthStatusDto:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    ApiEnvelopeBaseDto:
      type: object
      properties:
        code:
          type: number
          example: 0
          description: Business code; 0 means success
        message:
          type: string
          example: ok
        request_id:
          type: string
          example: req_01HX0000000000000000000000
      required:
        - code
        - message
        - request_id
    ApiEnvelopeDto:
      type: object
      properties:
        code:
          type: number
          example: 0
          description: Business code; 0 means success
        message:
          type: string
          example: ok
        request_id:
          type: string
          example: req_01HX0000000000000000000000
        data:
          type: object
          additionalProperties: true
          description: Operation payload; its shape is documented per endpoint
      required:
        - code
        - message
        - request_id
        - data
    ApiValidationIssueDto:
      type: object
      properties:
        field:
          type: string
          example: dict_key
        message:
          type: string
          example: dict_key must be longer than or equal to 1 characters
      required:
        - field
        - message
    ApiErrorEnvelopeDto:
      type: object
      properties:
        code:
          type: number
          enum:
            - 40001
            - 40101
            - 40102
            - 40301
            - 40302
            - 40303
            - 40304
            - 40305
            - 40401
            - 40402
            - 40901
            - 40902
            - 41301
            - 42201
            - 42901
            - 50001
            - 50301
          example: 40001
          description: Stable business error code
        message:
          type: string
          example: Bad request
        data:
          type: object
          additionalProperties: true
          nullable: true
          example: null
          description: Always null for failures
        request_id:
          type: string
          example: req_01HX0000000000000000000000
        details:
          description: Field-level validation details when available
          type: array
          items:
            $ref: "#/components/schemas/ApiValidationIssueDto"
      required:
        - code
        - message
        - data
        - request_id
    AdminProfileDto:
      type: object
      properties:
        admin_id:
          type: string
          example: 01HX0000000000000000000000
        username:
          type: string
          example: operator01
        role:
          type: string
          enum:
            - super_admin
            - operator
            - reviewer
          example: operator
        totp_enabled:
          type: boolean
          example: true
      required:
        - admin_id
        - username
        - role
        - totp_enabled
    AdminSessionDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
      required:
        - csrf_token
        - admin
    LoginMfaRequiredDto:
      type: object
      properties:
        mfa_required:
          type: boolean
          enum:
            - true
          example: true
        mfa_token:
          type: string
          example: mfa-token-value
      required:
        - mfa_required
        - mfa_token
    LoginMustBindTotpDto:
      type: object
      properties:
        must_bind_totp:
          type: boolean
          enum:
            - true
          example: true
        mfa_token:
          type: string
          example: mfa-token-value
      required:
        - must_bind_totp
        - mfa_token
    LoginDto:
      type: object
      properties:
        username:
          type: string
          example: operator01
          maxLength: 64
        password:
          type: string
          example: correct horse battery staple
          maxLength: 128
      required:
        - username
        - password
    TotpSetupDto:
      type: object
      properties:
        otpauth_uri:
          type: string
          example: otpauth://totp/SZFisher:operator01?secret=...
        manual_key:
          type: string
          example: JBSWY3DPEHPK3PXP
      required:
        - otpauth_uri
        - manual_key
    MfaTokenDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
      required:
        - mfa_token
    TotpEnableDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        recovery_codes:
          example:
            - AAAA-BBBB
            - CCCC-DDDD
          type: array
          items:
            type: string
      required:
        - csrf_token
        - admin
        - recovery_codes
    TotpCodeDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
        code:
          type: string
          example: "123456"
          pattern: ^\d{6}$
      required:
        - mfa_token
        - code
    TotpRecoveryDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
