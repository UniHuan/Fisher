openapi: 3.0.3
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusDto"
      tags: &a1
        - public
  /ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusDto"
        "503":
          description: Dependency unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags: *a1
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters:
        - &a2
          name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - &a3
          name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Session issued, TOTP required, or TOTP binding required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AdminSessionDto"
                          - $ref: "#/components/schemas/LoginMfaRequiredDto"
                          - $ref: "#/components/schemas/LoginMustBindTotpDto"
        "400": &a4
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401": &a5
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403": &a6
          description: Forbidden (40301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404": &a7
          description: Not found (40401)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "409": &a8
          description: State conflict (40901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "413": &a9
          description: Payload too large (41301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "422": &a10
          description: Business validation failed (42201)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "429":
          description: Too many login attempts (42901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": &a11
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "503": &a12
          description: Dependency unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags: &a13
        - admin auth
  /api/v1/admin/auth/refresh:
    post:
      operationId: AdminAuthController_refresh
      parameters:
        - *a2
        - *a3
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminSessionDto"
