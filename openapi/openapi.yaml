  /api/v1/reports:
    post:
      description: Always returns 201; moderation_status tells the client whether the
        content was published, rejected or queued for review.
      operationId: ReportsController_create
      parameters:
        - &a26
          name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - &a27
          name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportDto"
      responses:
        "201":
          description: Report stored; the machine review outcome is in moderation_status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateReportResponseDto"
        "400":
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401":
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403":
          description: Forbidden (40302, 40303, 40304, 40305)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404":
          description: Not found (40401)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "429":
          description: Too many requests (42901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500":
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security:
        - bearer: []
      summary: Publish a text-only comment, catch or intel report
      tags: &a28
        - reports
  /api/v1/reports/mine:
    get:
      operationId: ReportsController_mine
      parameters:
        - *a26
        - *a27
        - name: status
          required: false
          in: query
          description: pending=machine_pending; published=published/human_approved;
            rejected=machine_rejected/human_rejected; removed=admin removal
          schema:
            default: all
            type: string
            enum:
              - all
              - pending
              - published
              - rejected
              - removed
        - name: cursor
          required: false
          in: query
          description: "Opaque cursor: base64(created_at|report_id)"
          schema:
            maxLength: 256
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 20
            default: 10
            type: integer
      responses:
        "200":
          description: The current user report page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/MyReportPageDto"
