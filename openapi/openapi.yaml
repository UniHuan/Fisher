openapi: 3.0.3
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusDto"
      tags: &a1
        - public
  /ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusDto"
        "503":
          description: Dependency unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags: *a1
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Session issued, TOTP required, or TOTP binding required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AdminSessionDto"
                          - $ref: "#/components/schemas/LoginMfaRequiredDto"
                          - $ref: "#/components/schemas/LoginMustBindTotpDto"
        "400": &a2
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401": &a3
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403": &a4
          description: Forbidden (40301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404": &a5
          description: Not found (40401)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "409": &a6
          description: State conflict (40901)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "413": &a7
          description: Payload too large (41301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "422": &a8
          description: Business validation failed (42201)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": &a9
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "503": &a10
          description: Dependency unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags: &a11
        - admin auth
  /api/v1/admin/auth/refresh:
    post:
      operationId: AdminAuthController_refresh
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminSessionDto"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      tags: *a11
  /api/v1/admin/auth/logout:
    post:
      operationId: AdminAuthController_logout
      parameters:
        - name: X-CSRF-Token
          in: header
          description: Synchronizer CSRF token issued by login or refresh
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logged out; data is null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        nullable: true
                        example: null
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      security:
        - admin-cookie: []
      tags: *a11
  /api/v1/admin/auth/totp/setup:
    post:
      operationId: AdminAuthController_setupTotp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaTokenDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TotpSetupDto"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      tags: *a11
  /api/v1/admin/auth/totp/enable:
    post:
      operationId: AdminAuthController_enableTotp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TotpEnableDto"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      tags: *a11
  /api/v1/admin/auth/totp/verify:
    post:
      operationId: AdminAuthController_verifyTotp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminSessionDto"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      tags: *a11
  /api/v1/admin/auth/totp/recovery:
    post:
      operationId: AdminAuthController_recovery
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCodeDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TotpRecoveryDto"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      tags: *a11
  /api/v1/admin/me:
    get:
      operationId: AdminAuthController_me
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/MeDto"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "422": *a8
        "500": *a9
        "503": *a10
      security:
        - admin-cookie: []
      tags: *a11
  /api/v1/admin/audit-logs:
    get:
      operationId: AuditLogController_list
      parameters: []
      responses:
        "200":
          description: Paginated audit log rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AuditLogPageDto"
        "400":
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401":
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403":
          description: Forbidden (40301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500":
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security:
        - admin-cookie: []
      tags:
        - audit
  /api/v1/dictionaries:
    get:
      operationId: DictionariesController_list
      parameters: []
      responses:
        "200":
          description: Dictionary payload with a strong ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/PublicDictionariesDto"
        "304":
          description: ETag matched; no body
        "400":
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500":
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags:
        - public
  /api/v1/admin/dictionaries:
    get:
      operationId: AdminDictionariesController_list
      parameters: []
      responses:
        "200":
          description: Dictionary rows in a stable list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminDictionaryListDto"
        "400": &a12
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "401": &a13
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403": &a14
          description: Forbidden (40301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": &a15
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security: &a16
        - admin-cookie: []
      summary: List every dictionary row, including disabled ones
      tags: &a17
        - admin dictionaries
    post:
      operationId: AdminDictionariesController_create
      parameters:
        - name: X-CSRF-Token
          in: header
          description: Synchronizer CSRF token issued by login or refresh
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDictionaryDto"
      responses:
        "201":
          description: Created dictionary row
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminDictionaryItemDto"
        "400": *a12
        "401": *a13
        "403": *a14
        "409":
          description: Dictionary key already exists (40901)
        "500": *a15
      security: *a16
      summary: Create a dictionary row
      tags: *a17
  /api/v1/admin/dictionaries/{type}/{key}:
    put:
      operationId: AdminDictionariesController_update
      parameters:
        - name: type
          required: true
          in: path
          schema:
            example: poi_type
            type: string
        - name: key
          required: true
          in: path
          schema:
            example: food
            type: string
        - name: X-CSRF-Token
          in: header
          description: Synchronizer CSRF token issued by login or refresh
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDictionaryDto"
      responses:
        "200":
          description: Updated dictionary row
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminDictionaryItemDto"
        "400": *a12
        "401": *a13
        "403": *a14
        "404":
          description: Dictionary row does not exist (40401)
        "500": *a15
      security: *a16
      summary: Update a dictionary label, order, visibility or parent
      tags: *a17
  /api/v1/config:
    get:
      operationId: ClientConfigController_get
      parameters: []
      responses:
        "200":
          description: Map defaults, feature switches and freshness with a strong ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ClientConfigDto"
        "304":
          description: ETag matched; no body
        "400":
          description: Bad request (40001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500":
          description: Internal server error (50001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      tags:
        - config
info:
  title: SZFisher API
  description: "Shenzhen fishing assistant API. Base path: /api/v1."
  version: 1.0.0
  contact: {}
tags:
  - name: public
    description: Public client endpoints
  - name: admin auth
    description: Admin authentication and sessions
  - name: admin dictionaries
    description: Super-admin dictionary maintenance
  - name: audit
    description: Audit log queries
  - name: config
    description: Client configuration whitelist
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    admin-cookie:
      type: apiKey
      in: cookie
      name: __Host-fish_access
  schemas:
    HealthStatusDto:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    ApiEnvelopeBaseDto:
      type: object
      properties:
        code:
          type: number
          example: 0
          description: Business code; 0 means success
        message:
          type: string
          example: ok
        request_id:
          type: string
          example: req_01HX0000000000000000000000
      required:
        - code
        - message
        - request_id
    ApiEnvelopeDto:
      type: object
      properties:
        code:
          type: number
          example: 0
          description: Business code; 0 means success
        message:
          type: string
          example: ok
        request_id:
          type: string
          example: req_01HX0000000000000000000000
        data:
          type: object
          additionalProperties: true
          description: Operation payload; its shape is documented per endpoint
      required:
        - code
        - message
        - request_id
        - data
    ApiValidationIssueDto:
      type: object
      properties:
        field:
          type: string
          example: dict_key
        message:
          type: string
          example: dict_key must be longer than or equal to 1 characters
      required:
        - field
        - message
    ApiErrorEnvelopeDto:
      type: object
      properties:
        code:
          type: number
          enum:
            - 40001
            - 40101
            - 40102
            - 40301
            - 40401
            - 40901
            - 40902
            - 41301
            - 42201
            - 42901
            - 50001
            - 50301
          example: 40001
          description: Stable business error code
        message:
          type: string
          example: Bad request
        data:
          type: object
          additionalProperties: true
          nullable: true
          example: null
          description: Always null for failures
        request_id:
          type: string
          example: req_01HX0000000000000000000000
        details:
          description: Field-level validation details when available
          type: array
          items:
            $ref: "#/components/schemas/ApiValidationIssueDto"
      required:
        - code
        - message
        - data
        - request_id
    AdminProfileDto:
      type: object
      properties:
        admin_id:
          type: string
          example: 01HX0000000000000000000000
        username:
          type: string
          example: operator01
        role:
          type: string
          enum:
            - super_admin
            - operator
            - reviewer
          example: operator
        totp_enabled:
          type: boolean
          example: true
      required:
        - admin_id
        - username
        - role
        - totp_enabled
    AdminSessionDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
      required:
        - csrf_token
        - admin
    LoginMfaRequiredDto:
      type: object
      properties:
        mfa_required:
          type: boolean
          enum:
            - true
          example: true
        mfa_token:
          type: string
          example: mfa-token-value
      required:
        - mfa_required
        - mfa_token
    LoginMustBindTotpDto:
      type: object
      properties:
        must_bind_totp:
          type: boolean
          enum:
            - true
          example: true
        mfa_token:
          type: string
          example: mfa-token-value
      required:
        - must_bind_totp
        - mfa_token
    LoginDto:
      type: object
      properties:
        username:
          type: string
          example: operator01
          maxLength: 64
        password:
          type: string
          example: correct horse battery staple
          maxLength: 128
      required:
        - username
        - password
    TotpSetupDto:
      type: object
      properties:
        otpauth_uri:
          type: string
          example: otpauth://totp/SZFisher:operator01?secret=...
        manual_key:
          type: string
          example: JBSWY3DPEHPK3PXP
      required:
        - otpauth_uri
        - manual_key
    MfaTokenDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
      required:
        - mfa_token
    TotpEnableDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        recovery_codes:
          example:
            - AAAA-BBBB
            - CCCC-DDDD
          type: array
          items:
            type: string
      required:
        - csrf_token
        - admin
        - recovery_codes
    TotpCodeDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
        code:
          type: string
          example: "123456"
          pattern: ^\d{6}$
      required:
        - mfa_token
        - code
    TotpRecoveryDto:
      type: object
      properties:
        csrf_token:
          type: string
          example: csrf-token-value
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        remaining_recovery_codes:
          type: number
          example: 9
      required:
        - csrf_token
        - admin
        - remaining_recovery_codes
    RecoveryCodeDto:
      type: object
      properties:
        mfa_token:
          type: string
          example: mfa-token-value
          maxLength: 128
        recovery_code:
          type: string
          example: AAAA-BBBB
          maxLength: 32
      required:
        - mfa_token
        - recovery_code
    MeDto:
      type: object
      properties:
        admin:
          $ref: "#/components/schemas/AdminProfileDto"
        permissions:
          example:
            - spot:read
            - audit:read
          type: array
          items:
            type: string
        csrf_token:
          type: string
          example: csrf-token-value
      required:
        - admin
        - permissions
        - csrf_token
    AuditLogItemDto:
      type: object
      properties:
        log_id:
          type: string
          example: 01HX0000000000000000000000
        admin_id:
          type: string
          example: 01HX0000000000000000000001
        action:
          type: string
          example: dictionary.update
        entity_type:
          type: string
          example: dictionary
        entity_id:
          type: string
          nullable: true
          example: poi_type:food
        before_json:
          type: object
          additionalProperties: true
          nullable: true
        after_json:
          type: object
          additionalProperties: true
          nullable: true
        ip:
          type: string
          nullable: true
          example: 203.0.113.10
        request_id:
          type: string
          nullable: true
          example: req_01HX0000000000000000000000
        user_agent:
          type: string
          nullable: true
          example: szfisher-admin/1.0.0
        created_at:
          type: string
          example: 2026-11-16T08:00:00.000Z
      required:
        - log_id
        - admin_id
        - action
        - entity_type
        - entity_id
        - before_json
        - after_json
        - ip
        - request_id
        - user_agent
        - created_at
    AuditLogPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogItemDto"
        page:
          type: number
          example: 1
        page_size:
          type: number
          example: 20
        total:
          type: number
          example: 1
        has_more:
          type: boolean
          example: false
      required:
        - items
        - page
        - page_size
        - total
        - has_more
    PublicDictionaryItemDto:
      type: object
      properties:
        key:
          type: string
          example: food
        label:
          type: string
          example: 餐饮
        sort_order:
          type: number
          example: 1
      required:
        - key
        - label
        - sort_order
    PublicDictionariesDto:
      type: object
      properties:
        districts:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
        fish_types:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
        fee_status:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
        water_types:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
        venue_types:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
        fishing_methods:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
        poi_types:
          type: array
          items:
            $ref: "#/components/schemas/PublicDictionaryItemDto"
      required:
        - districts
        - fish_types
        - fee_status
        - water_types
        - venue_types
        - fishing_methods
        - poi_types
    AdminDictionaryItemDto:
      type: object
      properties:
        dict_type:
          type: string
          example: poi_type
        dict_key:
          type: string
          example: food
        dict_label:
