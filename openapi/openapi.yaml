  /api/v1/reports/{id}/like:
    post:
      description: "Idempotent: a repeated like returns the current count without
        inserting a second row. At most 60 like actions per user per minute."
      operationId: ReportsController_like
      parameters:
        - *a26
        - *a27
        - name: id
          required: true
          in: path
          description: Report ULID
          schema:
            example: 01HX0000000000000000000000
            type: string
      responses:
        "201":
          description: The like exists and the current like count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ReportLikeResponseDto"
        "401":
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403":
          description: Forbidden (40302, 40304)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404":
          description: Not found (40402)
          content:
            application/json:
              schema:
