                    properties:
                      data:
                        $ref: "#/components/schemas/ReportLikeResponseDto"
        "401":
          description: Authentication required (40101, 40102)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "403":
          description: Forbidden (40302, 40304)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "404":
          description: Not found (40402)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "429":
          description: Too many requests (42901)
          content:
            application/json:
