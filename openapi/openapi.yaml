                        $ref: "#/components/schemas/PoiSyncRunDto"
        "400": *a84
        "401": *a85
        "403": *a86
        "404":
          description: Spot does not exist (40401)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
        "500": *a87
        "503":
          description: POI provider unavailable (50301)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelopeDto"
      security: *a88
      summary: Sync nearby POIs from the configured provider
      tags: *a89
  /api/v1/admin/uploads:
    post:
      operationId: UploadsController_create
      parameters:
        - name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
        - name: X-CSRF-Token
          in: header
          description: Synchronizer CSRF token issued by login or refresh
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - spot_id
                - purpose
                - file
