  /api/v1/admin/audit-logs:
    get:
      operationId: AuditLogController_list
      parameters:
        - name: X-Client-Type
          in: header
          description: Client platform; the request is rejected when missing or unknown
          required: true
          schema:
            type: string
            enum:
              - miniprogram
              - ios
              - admin
            example: admin
        - name: X-Client-Version
          in: header
          description: Client build version; required on every /api/v1 request
          required: true
          schema:
            type: string
            example: 1.0.0
        - name: admin_id
          required: false
          in: query
          description: Filter by admin ULID; operators are scoped to themselves regardless
          schema:
            minLength: 26
            maxLength: 26
            example: 01HX0000000000000000000000
            type: string
        - name: action
          required: false
          in: query
          description: Exact audit action name
          schema:
            minLength: 1
            maxLength: 64
            example: dictionary.update
            type: string
        - name: entity_type
          required: false
          in: query
          description: Exact entity type
          schema:
            minLength: 1
            maxLength: 64
            example: dictionary
            type: string
        - name: from
          required: false
          in: query
          description: Inclusive lower bound on created_at (ISO 8601)
          schema:
            format: date-time
            example: 2026-11-16T00:00:00.000Z
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive upper bound on created_at (ISO 8601)
          schema:
            format: date-time
            example: 2026-11-16T23:59:59.999Z
            type: string
        - name: page
          required: false
          in: query
          description: Page number, starting at 1
          schema:
            minimum: 1
            default: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Page size
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        "200":
          description: Paginated audit log rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelopeBaseDto"
                  - required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AuditLogPageDto"
        "400":
