name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma Client generation and the build do not connect; give Prisma a placeholder URL.
      DATABASE_URL: postgresql://szfisher:szfisher@localhost:5432/szfisher_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Guards the Docker build context: nested .env files must stay out, examples may stay.
      - name: Check Docker context ignores nested env files
        run: |
          for path in .env apps/api/.env apps/api/prisma/.env; do
            if ! git -c core.excludesFile="$PWD/.dockerignore" check-ignore --no-index -q "$path"; then
              echo "::error::$path would enter the Docker build context"
              exit 1
            fi
          done
          for path in .env.example; do
            if git -c core.excludesFile="$PWD/.dockerignore" check-ignore --no-index -q "$path"; then
              echo "::error::$path must remain in the Docker build context"
              exit 1
            fi
          done
      # Version comes from the root package.json "packageManager" field (pnpm@10.0.0).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szfisher/shared build
      - run: pnpm --filter @szfisher/api-client build
      - run: pnpm --filter @szfisher/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check operational script syntax
        run: |
          bash -n scripts/backup-postgres.sh
          bash -n scripts/smoke-api.sh

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: szfisher_test
          POSTGRES_USER: szfisher
          POSTGRES_PASSWORD: szfisher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U szfisher -d szfisher_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://szfisher:szfisher@localhost:5432/szfisher_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Version comes from the root package.json "packageManager" field (pnpm@10.0.0).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szfisher/shared build
      - run: pnpm --filter @szfisher/api prisma:generate
      # test:integration owns test database preparation (guarded reset plus seed).
      - run: pnpm test:integration
      # Regenerates OpenAPI and client types, then fails if either differs from the commit.
      - run: pnpm openapi:check

  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: szfisher_test
          POSTGRES_USER: szfisher
          POSTGRES_PASSWORD: szfisher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U szfisher -d szfisher_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://szfisher:szfisher@localhost:5432/szfisher_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szfisher/shared build
      - run: pnpm --filter @szfisher/api prisma:generate
      - run: pnpm db:test:prepare
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:admin

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Validates both Compose files against the Compose schema.
      - name: Validate Compose files
        run: |
          docker compose -f infra/docker/docker-compose.yml config > /dev/null
          docker compose -f infra/docker/docker-compose.test.yml config > /dev/null
          DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder \
            API_IMAGE=szfisher-api:ci \
            ADMIN_ORIGINS=https://admin.example.test \
            JWT_ACCESS_SECRET=placeholder-jwt-secret-0123456789abcdef \
            CSRF_SECRET=placeholder-csrf-secret-0123456789abcdef \
            TOTP_ENCRYPTION_KEY=placeholder-totp-key-0123456789abcdef \
            docker compose -f infra/docker/docker-compose.prod.yml config > /dev/null
      # Proves both production images build; the API build stage uses only a placeholder URL.
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t szfisher-api:ci .
      - name: Build admin static image
        run: docker build -f infra/docker/Dockerfile.admin -t szfisher-admin:ci .
      - name: Validate Nginx config
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$PWD/infra/nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
