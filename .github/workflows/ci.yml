name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma Client generation and the build do not connect; give Prisma a placeholder URL.
      DATABASE_URL: postgresql://szfisher:szfisher@localhost:5432/szfisher_test?schema=public
    steps:
      - uses: actions/checkout@v4
      # Guards the Docker build context: nested .env files must stay out, examples may stay.
      - name: Check Docker context ignores nested env files
        run: |
          for path in .env apps/api/.env apps/api/prisma/.env; do
            if ! git -c core.excludesFile="$PWD/.dockerignore" check-ignore --no-index -q "$path"; then
              echo "::error::$path would enter the Docker build context"
              exit 1
            fi
          done
          for path in .env.example apps/api/.env.example; do
            if git -c core.excludesFile="$PWD/.dockerignore" check-ignore --no-index -q "$path"; then
              echo "::error::$path must remain in the Docker build context"
              exit 1
            fi
          done
      # Version comes from the root package.json "packageManager" field (pnpm@10.0.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szfisher/shared build
      - run: pnpm --filter @szfisher/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: szfisher_test
          POSTGRES_USER: szfisher
          POSTGRES_PASSWORD: szfisher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U szfisher -d szfisher_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://szfisher:szfisher@localhost:5432/szfisher_test?schema=public
    steps:
      - uses: actions/checkout@v4
      # Version comes from the root package.json "packageManager" field (pnpm@10.0.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szfisher/shared build
      - run: pnpm --filter @szfisher/api prisma:generate
      # test:integration owns test database preparation (guarded reset plus seed).
      - run: pnpm test:integration
